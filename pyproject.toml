[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqc-spherical"
version = "0.1.0"
description = "Variational quantum circuits on pure spherical manifolds"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
vqc-spherical = "vqc_spherical.RunAll:main"

[tool.setuptools.packages.find]
where = ["src"]
